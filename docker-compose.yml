# Open WebUI + Seedream image proxy + SearXNG web search for the home server ("homeserver").
#
#   Phone / PC --(Tailscale HTTPS)--> tailscale serve --> 127.0.0.1:3000 --> open-webui:8080
#   open-webui --(private Compose network)--> seedream:8787 --> BytePlus Seedream
#   open-webui --(private Compose network)--> searxng:8080 --> public search engines
#   Phone / PC --(Tailscale HTTPS, /searxng)--> tailscale serve --> 127.0.0.1:8888 --> searxng:8080
#   open-webui --> Venice API, Runpod GPU Pod (OpenAI-compatible connections)
#
# Secrets and per-machine values live in .env (copy .env.example). See README.md.
#
# IMPORTANT: Open WebUI copies most settings below into its database on the
# FIRST start only (empty data folder). After that, change them in
# Admin Panel > Settings; editing this file or .env no longer affects them.

name: homeserver-ai

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-v0.12.5}
    container_name: open-webui
    restart: unless-stopped
    # Only this machine can connect; `tailscale serve` publishes it as HTTPS
    # on your tailnet. Docker-published ports bypass the host firewall, so
    # never change this to 0.0.0.0 unless you mean to expose it on the LAN.
    ports:
      - "127.0.0.1:${OWUI_PORT:-3000}:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    # Upper bound so a runaway process can't starve the rest of the server.
    mem_limit: ${OWUI_MEM_LIMIT:-4g}
    environment:
      # Sessions survive container re-creation only with a fixed key.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env (openssl rand -hex 32)}
      WEBUI_URL: ${WEBUI_URL:-}
      # Admin account from .env, like on the Pod. Used only while the database
      # has no users; Open WebUI then also turns off new sign-ups.
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Admin}
      # Model connections (OpenAI-compatible): Venice, and the Runpod GPU Pod when used.
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URLS:?set OPENAI_API_BASE_URLS in .env}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:?set OPENAI_API_KEYS in .env}
      ENABLE_OLLAMA_API: "false"
      # A stopped GPU Pod delays the model list by this many seconds (default 10).
      AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST: "3"
      # Safer defaults for a private server.
      ENABLE_COMMUNITY_SHARING: "false"
      # Login lifetime (Open WebUI default 4w). Without Redis, "sign out" does
      # not revoke a session token, so shorter is safer if a device is lost.
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-4w}
      # SQLite otherwise allows up to 512 pooled connections.
      DATABASE_POOL_SIZE: "8"
      # Images through the Seedream proxy. "default" = use the proxy's own
      # ARK_API_KEY / SEEDREAM_MODEL; an empty IMAGE_SIZE = the proxy's 1K default.
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: openai
      IMAGES_OPENAI_API_BASE_URL: http://seedream:8787/v1
      IMAGES_OPENAI_API_KEY: default
      IMAGE_GENERATION_MODEL: default
      IMAGE_SIZE: ""
      ENABLE_IMAGE_EDIT: "true"
      IMAGE_EDIT_ENGINE: openai
      IMAGES_EDIT_OPENAI_API_BASE_URL: http://seedream:8787/v1
      IMAGES_EDIT_OPENAI_API_KEY: default
      IMAGE_EDIT_MODEL: default
      # Web search through the private SearXNG container. Open WebUI adds the
      # query itself, so the URL has no "?q=<query>".
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search
    depends_on:
      - seedream
      - searxng

  seedream:
    build: ./seedream
    image: homeserver-ai/seedream:local
    container_name: seedream
    restart: unless-stopped
    # Reachable only by other containers in this project (no "ports:" on purpose).
    expose:
      - "8787"
    environment:
      SEEDREAM_HOST: 0.0.0.0
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-}
      ARK_KEY_HOSTS: ${ARK_KEY_HOSTS:-}
      SEEDREAM_MODEL: ${SEEDREAM_MODEL:-}
      SEEDREAM_WATERMARK: ${SEEDREAM_WATERMARK:-}
      GEN_DEFAULT_SIZE: ${GEN_DEFAULT_SIZE:-}
      EDIT_SIZE_MODE: ${EDIT_SIZE_MODE:-}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-}
      UPSTREAM_RETRIES: ${UPSTREAM_RETRIES:-}
      # Keys that must never be forwarded to BytePlus if Open WebUI sends them.
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}

  searxng:
    # Pin a release; tags are at https://hub.docker.com/r/searxng/searxng/tags
    image: docker.io/searxng/searxng:${SEARXNG_TAG:-2026.11.2-cccbc9e15}
    container_name: searxng
    restart: unless-stopped
    # Only this machine can connect; `tailscale serve` publishes it as
    # /searxng on your tailnet. Open WebUI uses searxng:8080 directly.
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8888}:8080"
    volumes:
      # Turns on the JSON output Open WebUI needs. Only this file, read-only:
      # the image changes the owner of a mounted folder to its own user.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: ${SEARXNG_MEM_LIMIT:-512m}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (openssl rand -hex 32)}
      # Makes SearXNG generate its links and CSS paths under /searxng/.
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:?set SEARXNG_BASE_URL in .env}
